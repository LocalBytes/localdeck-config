packages:
  - packages/*
  - components/**
  - '!**/test/**'

catalog:
  '@nuxt/test-utils': ^4.1.0
  nuxt: ^4.5.2
  typescript: ^6.0.3
  vite: ^8.0.0
  vitest: ^4.1.9

overrides:
  # Nuxt ships Vite 7 internally; force Vite 8 across the workspace.
  esphome-config-ts: link:../esphome-config-ts
  vite: ^8.0.0
  vitest: ^4.1.9

pmOnFail: warn

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  esphome-config-ts: true
  unrs-resolver: true

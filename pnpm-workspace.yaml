packages:
  - packages/*
  - components/**
  - '!**/test/**'

catalog:
  '@nuxt/test-utils': ^4.3.2
  nuxt: ^4.5.2
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^4.1.11

overrides:
  # Nuxt ships Vite 7 internally; force Vite 8 across the workspace.
  vite: ^8.0.0
  vitest: ^4.1.9

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  esphome-config-ts@git+https://github.com/LocalBytes/esphome-config-ts.git: true
  unrs-resolver: true